# ══════════════════════════════════════════════════════════════════════
# WORKFLOW: gsc-index-check.yml — Search Console URL Inspection (ONCE A DAY)
# ══════════════════════════════════════════════════════════════════════
# Checks real Google indexing status for a quota-limited, prioritized batch
# of /jobs/ pages via the Search Console URL Inspection API, and persists
# the result to data/gsc_index_state.json. build_unindexed_feed.py (part of
# the main site-generation pipeline) reads that file and prefers its real
# verdicts over its own publication-age heuristic whenever a URL has been
# checked here -- see gsc_check_index_status.js's header comment for the
# full design (why once-daily, quota budget, prioritization order).
#
# Reuses the exact same GOOGLE_INDEXING_SA_JSON service-account secret as
# google-index-daily.yml -- same account, already granted Owner access in
# Search Console, same OAuth scope already includes webmasters.readonly.
# No new Google Cloud setup needed.
# ══════════════════════════════════════════════════════════════════════

name: 🔎 Search Console Index-Status Check (Daily)

on:
  schedule:
    - cron: '0 9 * * *'   # Daily ~2:30 PM IST (UTC 09:00) — after the Google
                          # Indexing API run (08:30 UTC) so today's fresh
                          # submissions aren't re-checked as "never seen".
  workflow_dispatch:

concurrency:
  group: gsc-index-check
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./.github/actions/skip-daily-duplicate
        with:
          workflow-file: gsc-index-check.yml

  check:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔎 Search Console URL Inspection sweep
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: node .github/workflows/gsc_check_index_status.js

      - name: 💾 Commit GSC index-status state
        if: always()
        run: node .github/workflows/save-gsc-index-state.js

      - name: 📊 Summary
        run: |
          echo "### 🔎 Search Console Index-Status Check" >> $GITHUB_STEP_SUMMARY
          echo "- **Time (IST):** $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
