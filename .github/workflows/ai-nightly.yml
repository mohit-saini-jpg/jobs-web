# ══════════════════════════════════════════════════════════════════
# FILE: .github/workflows/ai-nightly.yml
# PURPOSE: HTML pages seedha read → Groq API → HTML mein AI write
# JSON touch nahi karta
#
# DEPLOY-STORAGE FIX: ai_html_enricher.py ka default tha "har 10 pages pe
# git push" (PUSH_EVERY_CHECKPOINT=true) = ek run me 15-30 Vercel deployments
# (har ek ~1.2 GB). Ab PUSH_EVERY_CHECKPOINT='false': poore run me SIRF EK
# commit + EK push, end me => ek hi Vercel deployment.
# ══════════════════════════════════════════════════════════════════
name: 🌙 AI Content Enrichment (Nightly)

on:
  # ROOT CAUSE FIX (2026-07-17): the workflow_run "bonus" trigger (fired
  # after "Check & Fix Broken Job Links" completes) is REMOVED. It was
  # already documented as unreliable, but the real problem it caused was
  # worse than "sometimes doesn't fire" — when it DID fire while
  # punctual_dispatcher.py's punctual workflow_dispatch run was still
  # in progress, cancel-in-progress:true (see below) killed that in-progress
  # run outright. Then the native schedule cron (delayed, as GH's cron
  # always is here) fired ~7 minutes later and cancelled THAT one too.
  # Confirmed happening every single day (2026-07-16 and 2026-07-17 show
  # the identical dispatch→cancelled, workflow_run→cancelled, schedule→
  # success pattern) — two of every three runs were pure waste. The cron
  # below is the proven-reliable trigger; punctual_dispatcher.py's
  # workflow_dispatch is the punctual one. Two triggers, not three.
  schedule:
    - cron: '0 4 * * *'    # Daily 9:30 AM IST — after Check & Fix Broken
                            # Links' 9:00 AM fallback

  workflow_dispatch:
    inputs:
      run_limit:
        description: 'Pages per run (default: 800; Groq daily token quota usually stops it earlier)'
        default: '800'
        required: false
      force:
        description: 'Force re-enrich already done pages'
        type: boolean
        default: false
      slug:
        description: 'Single slug test (blank = all)'
        required: false
        default: ''

concurrency:
  group: ai-nightly
  # ROOT CAUSE FIX (2026-07-17): was true — see the git history for the
  # original "PERF FIX" rationale (a stale workflow_run-triggered instance
  # once got stuck and silently blocked every later trigger for a day).
  # That failure mode required a workflow_run-triggered run to exist at
  # all; now that trigger is removed entirely (see `on:` above), so there
  # is nothing left that can get silently stuck behind a dead workflow_run
  # queue slot. false means a same-day dispatcher run and the (usually
  # late-firing) native cron now QUEUE instead of cancelling each other —
  # whichever runs second hits the `guard` job's "already succeeded today"
  # check and exits in seconds instead of destroying the first run's
  # in-progress work. timeout-minutes: 170 below is still the hard backstop
  # against a truly hung run blocking the queue forever.
  cancel-in-progress: false

jobs:
  # Prevents a late-firing native `schedule` event from redoing today's
  # enrichment if punctual_dispatcher.py's workflow_dispatch already ran it
  # — see .github/actions/skip-daily-duplicate/action.yml. workflow_dispatch
  # (incl. manual test runs with custom inputs) is NEVER affected by this.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./.github/actions/skip-daily-duplicate
        with:
          workflow-file: ai-nightly.yml

  enrich:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 230       # 800 pages @ 4 RPM (~200 min) worst case + final commit/push headroom
    permissions:
      contents: write
    if: needs.guard.outputs.skip != 'true'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔑 Verify GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY is EMPTY"
            exit 1
          fi
          echo "Key length: ${#GROQ_API_KEY}"
          echo "Key prefix: ${GROQ_API_KEY:0:10}..."
          HTTP_CODE=$(curl -s -o /tmp/groq_resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-oss-120b","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}' \
            https://api.groq.com/openai/v1/chat/completions)
          echo "HTTP Code: $HTTP_CODE"
          cat /tmp/groq_resp.json
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "❌ Groq API rejected the key (HTTP $HTTP_CODE) — update GROQ_API_KEY secret"
            exit 1
          fi
          if [ "$HTTP_CODE" = "404" ]; then
            echo "❌ Model not found/unavailable (HTTP 404) — the key itself may be fine, the"
            echo "   test model above was likely deprecated by Groq. Check"
            echo "   https://console.groq.com/docs/deprecations and update the model here"
            echo "   AND in ai_html_enricher.py's MODEL_FALLBACK_CHAIN."
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Groq API call failed (HTTP $HTTP_CODE) — see response body above"
            exit 1
          fi
          echo "✅ Groq API key valid"

      - name: 🤖 Run AI HTML Enricher
        # Step cap < job cap, so the 'Final commit' step below (if: always())
        # still gets time to push whatever was enriched even on a timeout.
        timeout-minutes: 200
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL:    'openai/gpt-oss-120b'
          # Groq free plan (openai/gpt-oss-120b): 30 RPM, 1,000 req/day, 8K tokens/min,
          # 200K tokens/day. 4 RPM (15s) stays inside the 8K tokens/min limit; the script
          # also reads Retry-After on any 429 and waits exactly (page never skipped), and
          # stops cleanly when the daily token quota is exhausted (retry-after > 150s).
          GROQ_SAFE_RPM: '4'
          RUN_LIMIT:     ${{ github.event.inputs.run_limit || '800' }}
          DAILY_LIMIT:   '800'          # < 1,000 req/day Groq cap, margin for retries
          # *** THE FIX *** one commit + one push at the very end (=1 Vercel deploy)
          PUSH_EVERY_CHECKPOINT: 'false'
          # Quota guard (ai_html_enricher.py): counts tokens from each response and
          # stops/spills over to gpt-oss-20b (its own separate daily quota) at 88% of
          # 200K tokens/day per model - i.e. BEFORE Groq ever returns a 429 - then
          # commits + deploys once.
          TPD_LIMIT:             '200000'
          TPD_SAFETY:            '0.88'
          RPD_RESERVE:           '40'
          ALLOW_MODEL_SPILLOVER: 'true'
          FORCE_REGEN:   ${{ github.event.inputs.force || 'false' }}
          JOBS_DIR:      'jobs'
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          if [ -n "$SLUG" ]; then
            python3 ai_html_enricher.py --slug "$SLUG"
          else
            python3 ai_html_enricher.py
          fi

      - name: 💾 Final commit
        # always(): even if the enricher step timed out or failed midway, commit and
        # push the pages already enriched (one single push = one single deployment).
        if: ${{ always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add jobs/ .ai_progress_html.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          PATCHED=$(git diff --staged --name-only | grep "index.html" | wc -l || echo "0")
          DATE_IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M')
          git commit -m "🤖 AI enriched: ${PATCHED} HTML pages | ${DATE_IST} IST"

          # Robust push: another workflow (regen / sitemap / version bump) may have
          # pushed to main while we ran, causing a non-fast-forward rejection.
          # Rebase our commit onto the latest origin and retry; on a same-file
          # conflict fall back to a merge where our enriched version wins — remote's
          # other work is still merged in, nothing is lost.
          push_ok=0
          for i in 1 2 3 4 5; do
            if git push origin main; then push_ok=1; break; fi
            echo "push rejected (attempt $i/5) — syncing with origin/main…"
            git fetch origin main || true
            if ! git rebase origin/main; then
              echo "rebase conflict — falling back to merge (enriched version wins)"
              git rebase --abort 2>/dev/null || true
              git merge -X ours --no-edit origin/main || true
            fi
            sleep 4
          done
          if [ "$push_ok" = "1" ]; then
            echo "✅ ${PATCHED} pages pushed"
          else
            echo "❌ push failed after 5 attempts"; exit 1
          fi

      - name: 📊 Summary
        run: |
          echo "### 🌙 AI Nightly Enrichment" >> $GITHUB_STEP_SUMMARY
          echo "- **Model:** \`openai/gpt-oss-120b\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time (IST):** $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
